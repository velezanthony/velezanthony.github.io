name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# `deploy-pages` authenticates with an OIDC token, so it needs `id-token`.
permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deploy midway: a half-published site is worse than a stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # `astro check` runs here too — a type error must fail the deploy,
      # not ship silently.
      #
      # The GTM container ID is only ever set here. Unset, the tag simply is not
      # rendered, so local and fork builds stay untracked without a code path of
      # their own.
      - run: npm run build
        env:
          PUBLIC_GTM_ID: ${{ secrets.PUBLIC_GTM_ID }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
